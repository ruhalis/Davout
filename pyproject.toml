[project]
name = "davout"
version = "0.1.0"
description = "Open Jev-style typed-decision model on HRM-Text-1B, with a benchmark and fine-tuning harness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2",
    "torch>=2.9",
    "transformers>=5.17,<6",
    "huggingface_hub",
]

[project.optional-dependencies]
eval = ["datasets>=3"]
teacher = ["bitsandbytes>=0.45", "accelerate>=1.0"]

[project.scripts]
davout = "davout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/davout"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the real HRM-Text-1B weights",
]
